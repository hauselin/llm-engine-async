[project]
name = "llm-engine-async"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "polars>=1.43.2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "tqdm>=4.70.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ruff>=0.16.3",
    "ty>=0.0.72",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""
